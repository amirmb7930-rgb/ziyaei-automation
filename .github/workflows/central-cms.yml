name: Fix central CMS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[central-cms]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ziayi-automation-v8.html')
          s=p.read_text(encoding='utf-8')
          marker='🎨 ویرایش مستقیم سایت'
          if marker in s:
              s=s.replace("b.dataset.tab='site-editor'; b.innerHTML=", "b.innerHTML=")
              s=s.replace("const nav=document.querySelector('#adminModal .admin-nav');\n              if(!nav || nav.querySelector('[data-tab=\"site-editor\"]'))return;", "const nav=document.querySelector('#adminModal .admin-nav');\n              if(!nav || nav.querySelector('.central-site-editor'))return;")
              s=s.replace("b.type='button'; b.innerHTML='🎨 ویرایش مستقیم سایت';", "b.type='button'; b.className='central-site-editor'; b.innerHTML='🎨 ویرایش مستقیم سایت';")
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ziayi-automation-v8.html
          git diff --cached --quiet && exit 0
          git commit -m '[central-cms] Fix direct editor button routing'
          git push
