<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اتوماسیون صنعتی ضیائی</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151c}iframe{border:0;width:100%;height:100%;display:block}#sync{position:fixed;right:12px;bottom:12px;z-index:9999;background:#10151c;color:#fff;padding:7px 10px;border-radius:6px;font:12px sans-serif;opacity:.85}#sync.ok{display:none}</style>
</head>
<body>
<div id="sync">در حال اتصال به پایگاه داده…</div>
<iframe id="app" src="amperkala-smart-search-fixed.html" title="اتوماسیون صنعتی ضیائی"></iframe>
<script>
const SUPABASE_URL='https://ixawrychyhcbmeiwnvwj.supabase.co';
const SUPABASE_KEY='sb_publishable_7byeGAu4439JVXNBzvFfpA_RyZb78Jd';
const DBKEY='amperkala_v1';
const banner=document.getElementById('sync');
const frame=document.getElementById('app');
async function api(path){
  const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:SUPABASE_KEY,Accept:'application/json'}});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}
async function syncFromServer(){
  try{
    const [products,cats,settings,pages]=await Promise.all([
      api('products?select=*&active=eq.true&order=id.asc'),
      api('categories?select=*&order=id.asc'),
      api('site_settings?select=*&id=eq.1&limit=1'),
      api('pages?select=*&order=id.asc')
    ]);
    if(!products.length){banner.textContent='پایگاه داده هنوز محصولی ندارد';return;}
    const old=frame.contentWindow.localStorage.getItem(DBKEY);
    let d={};try{d=JSON.parse(old||'{}')}catch(e){}
    d.products=products.map(p=>({id:Number(p.id),cat:p.category,brand:p.brand,title:p.title,specs:Array.isArray(p.specs)?p.specs:[],price:Number(p.price||0),stock:Number(p.stock||0),unit:p.unit||'عدد',icon:p.icon||'ic-cable',images:Array.isArray(p.images)?p.images:[],mainImage:p.main_image||'',description:p.description||'',technical:p.technical||'',active:p.active!==false}));
    if(cats.length)d.categories=cats.map(c=>({id:Number(c.id),name:c.name}));
    if(settings[0]){const s=settings[0];d.settings=Object.assign({},d.settings||{}, {storeName:s.store_name,phone:s.phone,email:s.email,address:s.address,primary:s.primary_color,secondary:s.secondary_color,button:s.button_color,header:s.header_color,logo:s.logo,heroTitle:s.hero_title,heroText:s.hero_text,heroEyebrow:s.hero_eyebrow,heroBanner:s.hero_banner,whatsapp:s.whatsapp,instagram:s.instagram,social:s.social,about:s.about,utilityText:s.utility_text,supportText:s.support_text,footerCopyright:s.footer_copyright});}
    if(pages.length)d.pages=pages.map(p=>({id:Number(p.id),title:p.title,slug:p.slug,content:p.content}));
    frame.contentWindow.localStorage.setItem(DBKEY,JSON.stringify(d));
    banner.classList.add('ok');
    frame.contentWindow.location.reload();
  }catch(e){banner.textContent='اتصال به پایگاه داده انجام نشد';console.error(e)}
}
frame.addEventListener('load',()=>setTimeout(syncFromServer,300));
setInterval(()=>{if(!document.hidden)syncFromServer()},60000);
</script>
</body>
</html>
